name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew buildAndCollect

      - name: List produced jars
        run: |
          echo "--- root build/libs ---"
          find build/libs -name '*.jar' -print 2>/dev/null || true
          echo "--- per-version build/libs ---"
          find versions -path '*/build/libs/*.jar' -print 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-artifacts
          path: build/libs/**/*.jar
          if-no-files-found: error
          archive: false
